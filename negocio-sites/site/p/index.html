<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prévia do seu novo site</title>
<meta name="description" content="Veja como ficaria o site do seu negócio. Toque para abrir.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Prévia do seu novo site">
<meta property="og:description" content="Montamos uma prévia de site para o seu negócio. Toque para ver no celular.">
<meta property="og:image" content="https://vitrine61.pages.dev/img/og-previa.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../img/logo.svg">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F4F3EF;color:#14151A;text-align:center;padding:24px}
.c{max-width:420px}.spin{width:38px;height:38px;border-radius:50%;border:4px solid #d9d7cf;border-top-color:#2E4BFF;margin:0 auto 16px;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{color:#2E4BFF;font-weight:700}
</style>
</head>
<body>
<div class="c" id="msg"><div class="spin"></div><p>Abrindo a prévia do site…</p></div>
<script src="../config.js"></script>
<script src="../motor.js"></script>
<script>
(function () {
  var marca = window.VITRINE_CONFIG || {};
  var codigo = location.hash.slice(1);
  function erro(t) {
    var url = marca.url || '../';
    document.getElementById('msg').innerHTML = '<p>' + t + '</p><p><a href="' + url + '">Conhecer a ' + (marca.nome || 'Vitrine 61') + '</a></p>';
  }
  if (!codigo) return erro('Este link de prévia está incompleto.');
  if (codigo[0] === 'z' && typeof DecompressionStream !== 'function') return erro('Seu navegador é antigo para abrir esta prévia. Tente abrir no Chrome ou no Safari atualizado.');
  Vitrine.deLink(codigo).then(function (cfg) {
    cfg.modo = 'previa';
    cfg.agencia = { nome: marca.nome, whatsapp: marca.whatsapp, url: marca.url, preco: marca.preco };
    var html = Vitrine.gerarSite(cfg);
    Vitrine.substituirPagina(html);
  }).catch(function () { erro('Não conseguimos abrir esta prévia. O link pode ter sido cortado ao copiar.'); });
})();
</script>
</body>
</html>
