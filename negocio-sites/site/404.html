<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<link rel="icon" href="/img/logo.svg">
<style>
:root{--bg:#F4F3EF;--ink:#14151A;--soft:#575A68;--blue:#2E4BFF}
@media (prefers-color-scheme:dark){:root{--bg:#0F1013;--ink:#F2F1EC;--soft:#A7A9B5;--blue:#7088FF}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
.c{max-width:420px}img{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;display:block}
h1{font-size:24px;margin:0 0 10px}p{color:var(--soft);margin:0 0 22px;line-height:1.5}
a{display:inline-block;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
<div class="c">
  <img src="/img/logo.svg" alt="">
  <h1>Este link está incompleto ou errado</h1>
  <p>Se você recebeu um link de prévia, peça o link de novo pelo WhatsApp. Ele pode ter sido cortado ao copiar.</p>
  <a href="/">Ir para o site</a>
</div>
<script>
// Alguns apps trocam o "#" do link por "%23". Corrige e abre a prévia certa.
(function () {
  var p = location.pathname, i = p.indexOf('%23');
  if (i >= 0) location.replace(p.slice(0, i) + '#' + decodeURIComponent(p.slice(i + 3)) + location.search);
})();
</script>
</body>
</html>
